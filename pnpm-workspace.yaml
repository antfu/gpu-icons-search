ignoreWorkspaceRootCheck: true
catalogMode: prefer

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - knip@6.45.1
  - vite@8.3.8
  - skills@1.9.0

trustPolicy: no-downgrade

update:
  ignoreDeps:
    - typescript@7

shellEmulator: true

packages:
  - playground
  - training
  - docs
  - packages/*
  - examples/*

allowBuilds:
  esbuild: true
  simple-git-hooks: true

catalogs:
  agentic:
    '@antfu/skills': ^0.1.3
    skills: ^1.9.0
  cli:
    '@antfu/eslint-config': ^10.0.0
    '@antfu/ni': ^30.6.0
    bumpp: ^12.3.0
    eslint: ^10.15.0
    eslint-plugin-slop: ^0.1.3
    eslint-plugin-sonarjs: ^4.2.2
    knip: ^6.45.1
    nano-staged: ^1.0.2
    publint: ^0.3.25
    simple-git-hooks: ^2.14.0
    taze: ^21.3.0
    tsdown: ^0.23.7
    tsx: ^4.23.15
    typescript: ^6.0.3
    vite: ^8.3.8
  data:
    '@carbon/icons': ^11.92.0
    '@fortawesome/fontawesome-free': ^7.3.1
    '@iconify/json': ^2.2.559
    '@mdi/svg': ^7.4.47
    '@phosphor-icons/core': ^2.1.1
    '@primer/octicons': ^19.42.0
    '@tabler/icons': ^3.52.0
    ionicons: ^8.1.0
    lucide-static: ^1.76.0
  inlined:
    '@antfu/utils': ^9.3.0
  testing:
    tsdown-stale-guard: ^0.1.3
    tsnapi: ^1.6.1
    vitest: ^5.1.0
  training:
    '@anthropic-ai/sdk': ^1.10.0
    '@huggingface/transformers': ^4.3.2
    fzf: ^0.5.2
    webgpu: ^0.6.2
    yaml: ^2.9.1
    zod: ^4.6.7
  types:
    '@types/node': ^26.6.6
